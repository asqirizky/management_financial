<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Laporan - Aplikasi Buku Kas</title>
    <link rel="stylesheet" href="../admin/assets/plugins/global/plugins.bundle.css" />
    <link rel="stylesheet" href="../admin/assets/css/style.bundle.css" />
    <link rel="stylesheet" href="assets/css/kas.css" />
</head>
<body id="kt_app_body" data-page="laporan" class="app-default"
      data-kt-app-layout="light-sidebar"
      data-kt-app-header-fixed="true"
      data-kt-app-sidebar-enabled="true"
      data-kt-app-sidebar-fixed="true"
      data-kt-app-sidebar-hoverable="true"
      data-kt-app-sidebar-push-header="true"
      data-kt-app-sidebar-push-toolbar="true"
      data-kt-app-sidebar-push-footer="true"
      data-kt-app-toolbar-enabled="true">

    <div id="page-content">
        <div class="card">
            <div class="card-header pt-6 border-0">
                <div class="card-title">
                    <h2 class="fw-bold text-gray-900 mb-0">Laporan Arus Kas</h2>
                    <span class="text-gray-500 fw-semibold fs-7 mt-1 d-block">Rekap pemasukan dan pengeluaran per periode</span>
                </div>
                <div class="card-toolbar">
                    <div class="d-flex flex-wrap gap-3 align-items-end no-print">
                        <div class="d-flex flex-column">
                            <label class="fs-7 fw-semibold text-gray-500 mb-1">Mode</label>
                            <select class="form-select form-select-solid w-140px" id="f-mode">
                                <option value="bulan">Per Bulan</option>
                                <option value="kustom">Rentang Kustom</option>
                            </select>
                        </div>
                        <div class="d-flex flex-column" id="wrap-bulan">
                            <label class="fs-7 fw-semibold text-gray-500 mb-1">Bulan</label>
                            <input type="month" class="form-control form-control-solid w-180px" id="f-bulan" />
                        </div>
                        <div class="d-flex flex-column d-none" id="wrap-kustom">
                            <label class="fs-7 fw-semibold text-gray-500 mb-1">Dari</label>
                            <input type="date" class="form-control form-control-solid w-160px" id="f-dari" />
                        </div>
                        <div class="d-flex flex-column d-none" id="wrap-kustom2">
                            <label class="fs-7 fw-semibold text-gray-500 mb-1">Sampai</label>
                            <input type="date" class="form-control form-control-solid w-160px" id="f-sampai" />
                        </div>
                        <button type="button" class="btn btn-primary" id="btn-tampilkan">
                            <i class="ki-outline ki-magnifier fs-3 me-1"></i>Tampilkan
                        </button>
                        <button type="button" class="btn btn-light-primary" id="btn-cetak">
                            <i class="ki-outline ki-printer fs-3 me-1"></i>Cetak
                        </button>
                    </div>
                </div>
            </div>

            <div class="card-body pt-6">
                <div class="print-header">
                    <h3>LAPORAN ARUS KAS</h3>
                    <p id="print-periode">Periode</p>
                    <p id="print-tanggal">Dicetak</p>
                </div>

                <!-- Ringkasan -->
                <div class="row g-5 g-xl-10 mb-10">
                    <div class="col-xxl-3 col-md-6">
                        <div class="card card-flush bg-light-primary">
                            <div class="card-body">
                                <span class="fs-7 fw-semibold text-gray-500 d-block mb-1">Saldo Awal</span>
                                <span class="kas-stat-number fs-3 fw-bold text-primary" id="l-ap-saldo">Rp 0</span>
                            </div>
                        </div>
                    </div>
                    <div class="col-xxl-3 col-md-6">
                        <div class="card card-flush bg-light-success">
                            <div class="card-body">
                                <span class="fs-7 fw-semibold text-gray-500 d-block mb-1">Pemasukan</span>
                                <span class="kas-stat-number fs-3 fw-bold text-success" id="l-ap-masuk">Rp 0</span>
                            </div>
                        </div>
                    </div>
                    <div class="col-xxl-3 col-md-6">
                        <div class="card card-flush bg-light-danger">
                            <div class="card-body">
                                <span class="fs-7 fw-semibold text-gray-500 d-block mb-1">Pengeluaran</span>
                                <span class="kas-stat-number fs-3 fw-bold text-danger" id="l-ap-keluar">Rp 0</span>
                            </div>
                        </div>
                    </div>
                    <div class="col-xxl-3 col-md-6">
                        <div class="card card-flush bg-light">
                            <div class="card-body">
                                <span class="fs-7 fw-semibold text-gray-500 d-block mb-1">Saldo Akhir</span>
                                <span class="kas-stat-number fs-3 fw-bold text-gray-800" id="l-ap-akhir">Rp 0</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Detail transaksi -->
                <div class="table-responsive">
                    <table class="table table-bordered table-striped kas-ledger align-middle">
                        <thead class="fw-bold text-uppercase fs-7">
                            <tr class="text-center">
                                <th class="w-60px">No</th>
                                <th class="w-120px">Tanggal</th>
                                <th>Uraian</th>
                                <th class="w-160px">Kategori</th>
                                <th class="text-end w-160px">Debit (Rp)</th>
                                <th class="text-end w-160px">Kredit (Rp)</th>
                                <th class="text-end w-170px">Saldo (Rp)</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-laporan"></tbody>
                        <tfoot id="tfoot-laporan"></tfoot>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="../vendor/sweetalert/sweetalert.all.js"></script>
    <script src="../admin/assets/plugins/global/plugins.bundle.js"></script>
    <script src="../admin/assets/js/scripts.bundle.js"></script>
    <script src="assets/js/kas.js"></script>
    <script>
        var K = kasApp;

        kasApp.init({
            page: 'laporan',
            title: 'Laporan',
            crumbs: [['Beranda', 'index.html'], ['Laporan']],
            onReady: function () {
                var today = K.isoToday();
                document.getElementById('f-bulan').value = today.slice(0, 7);
                document.getElementById('f-dari').value = today.slice(0, 8) + '01';
                document.getElementById('f-sampai').value = today;

                document.getElementById('f-mode').addEventListener('change', function () {
                    var kustom = this.value === 'kustom';
                    document.getElementById('wrap-bulan').classList.toggle('d-none', kustom);
                    document.getElementById('wrap-kustom').classList.toggle('d-none', !kustom);
                    document.getElementById('wrap-kustom2').classList.toggle('d-none', !kustom);
                });
                document.getElementById('btn-tampilkan').addEventListener('click', renderLaporan);
                document.getElementById('btn-cetak').addEventListener('click', function () { window.print(); });
                renderLaporan();
            }
        });

        function renderLaporan() {
            var mode = document.getElementById('f-mode').value;
            var dari, sampai;

            if (mode === 'kustom') {
                dari = document.getElementById('f-dari').value;
                sampai = document.getElementById('f-sampai').value;
                if (!dari || !sampai) { K.toast('Lengkapi rentang tanggal!', 'warning'); return; }
                if (dari > sampai) { K.toast('Tanggal "Dari" tidak boleh lebih besar dari "Sampai"!', 'warning'); return; }
            } else {
                var bln = document.getElementById('f-bulan').value || K.isoToday().slice(0, 7);
                dari = bln + '-01';
                var lastDay = new Date(+bln.slice(0, 4), +bln.slice(5, 7), 0).getDate();
                sampai = bln + '-' + (lastDay < 10 ? '0' + lastDay : lastDay);
            }

            var all = K.getTrx();
            var list = all.filter(function (t) { return t.tanggal >= dari && t.tanggal <= sampai; });
            var sebelum = all.filter(function (t) { return t.tanggal < dari; });

            var saldoMulai = K.getSaldoAwal() + K.sumTipe(sebelum, 'masuk') - K.sumTipe(sebelum, 'keluar');
            var totalDebit = K.sumTipe(list, 'masuk');
            var totalKredit = K.sumTipe(list, 'keluar');
            var saldoAkhir = saldoMulai + totalDebit - totalKredit;

            document.getElementById('l-ap-saldo').textContent = K.formatRupiah(saldoMulai);
            document.getElementById('l-ap-masuk').textContent = K.formatRupiah(totalDebit);
            document.getElementById('l-ap-keluar').textContent = K.formatRupiah(totalKredit);
            document.getElementById('l-ap-akhir').textContent = K.formatRupiah(saldoAkhir);

            var asc = K.sortedTrx(list).reverse();
            var tbody = document.getElementById('tbody-laporan');
            var tfoot = document.getElementById('tfoot-laporan');

            if (!list.length) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-gray-500 fw-semibold py-8">' +
                    'Belum ada transaksi pada periode ini.</td></tr>';
            } else {
                var run = saldoMulai;
                tbody.innerHTML = asc.map(function (t, i) {
                    run += t.tipe === 'masuk' ? Number(t.jumlah) : -Number(t.jumlah);
                    var isMasuk = t.tipe === 'masuk';
                    var kat = K.namaKategori(t.kategori);
                    return '<tr>' +
                        '<td class="text-center text-gray-600">' + (i + 1) + '</td>' +
                        '<td class="text-nowrap text-gray-600 fw-semibold">' + K.formatTanggalPendek(t.tanggal) + '</td>' +
                        '<td class="text-gray-800 fw-semibold">' + (t.keterangan || t.kategori) + '</td>' +
                        '<td><span class="badge badge-light" style="--bs-badge-bg:' + (kat ? kat.warna : '#a7a7c4') + '22; --bs-badge-color:' + (kat ? kat.warna : '#a7a7c4') + '">' + t.kategori + '</span></td>' +
                        '<td class="text-end ' + (isMasuk ? 'fw-bold text-success' : 'text-gray-600') + '">' + (isMasuk ? K.formatRupiah(t.jumlah) : '-') + '</td>' +
                        '<td class="text-end ' + (!isMasuk ? 'fw-bold text-danger' : 'text-gray-600') + '">' + (!isMasuk ? K.formatRupiah(t.jumlah) : '-') + '</td>' +
                        '<td class="text-end kas-ledger-saldo text-gray-800">' + K.formatRupiah(run) + '</td>' +
                        '</tr>';
                }).join('');
            }

            tfoot.innerHTML = '<tr class="fw-bold bg-light">' +
                '<td colspan="4" class="text-end text-uppercase fs-7">Jumlah</td>' +
                '<td class="text-end text-success">' + K.formatRupiah(totalDebit) + '</td>' +
                '<td class="text-end text-danger">' + K.formatRupiah(totalKredit) + '</td>' +
                '<td class="text-end kas-ledger-saldo">' + K.formatRupiah(saldoAkhir) + '</td>' +
                '</tr>';

            document.getElementById('print-periode').textContent =
                'Periode: ' + K.formatTanggal(dari) + ' s/d ' + K.formatTanggal(sampai);
            document.getElementById('print-tanggal').textContent = 'Dicetak: ' + K.formatTanggal(K.isoToday());
        }
    </script>
</body>
</html>
