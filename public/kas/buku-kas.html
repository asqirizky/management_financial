<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Buku Kas - Aplikasi Buku Kas</title>
    <link rel="stylesheet" href="../admin/assets/plugins/global/plugins.bundle.css" />
    <link rel="stylesheet" href="../admin/assets/css/style.bundle.css" />
    <link rel="stylesheet" href="assets/css/kas.css" />
</head>
<body id="kt_app_body" data-page="buku-kas" class="app-default"
      data-kt-app-layout="light-sidebar"
      data-kt-app-header-fixed="true"
      data-kt-app-sidebar-enabled="true"
      data-kt-app-sidebar-fixed="true"
      data-kt-app-sidebar-hoverable="true"
      data-kt-app-sidebar-push-header="true"
      data-kt-app-sidebar-push-toolbar="true"
      data-kt-app-sidebar-push-footer="true"
      data-kt-app-toolbar-enabled="true">

    <div id="page-content">
        <div class="card">
            <div class="card-header pt-6 border-0">
                <div class="card-title">
                    <h2 class="fw-bold text-gray-900 mb-0">Buku Kas Umum</h2>
                    <span class="text-gray-500 fw-semibold fs-7 mt-1 d-block">Debit (masuk) dan kredit (keluar) dengan saldo berjalan</span>
                </div>
                <div class="card-toolbar">
                    <div class="d-flex flex-wrap gap-3 align-items-center no-print">
                        <div class="d-flex flex-column">
                            <label class="fs-7 fw-semibold text-gray-500 mb-1">Saldo Awal (Rp)</label>
                            <input type="number" min="0" step="1000" class="form-control form-control-solid w-180px" id="saldo-awal" />
                        </div>
                        <div class="d-flex flex-column">
                            <label class="fs-7 fw-semibold text-gray-500 mb-1">Periode</label>
                            <select class="form-select form-select-solid w-180px" id="f-bulan"></select>
                        </div>
                        <button type="button" class="btn btn-light-primary" id="btn-cetak">
                            <i class="ki-outline ki-printer fs-3 me-1"></i>Cetak
                        </button>
                    </div>
                </div>
            </div>

            <div class="card-body pt-6">
                <div class="print-header">
                    <h3>BUKU KAS</h3>
                    <p id="print-periode">Periode</p>
                    <p id="print-saldo">Saldo Awal</p>
                </div>

                <div class="table-responsive">
                    <table class="table table-bordered table-striped kas-ledger align-middle">
                        <thead class="fw-bold text-uppercase fs-7">
                            <tr class="text-center">
                                <th class="w-60px">No</th>
                                <th class="w-120px">Tanggal</th>
                                <th>Uraian</th>
                                <th class="w-160px">Kategori</th>
                                <th class="text-end w-160px">Debit (Rp)</th>
                                <th class="text-end w-160px">Kredit (Rp)</th>
                                <th class="text-end w-170px">Saldo (Rp)</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-buku"></tbody>
                        <tfoot id="tfoot-buku"></tfoot>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="../vendor/sweetalert/sweetalert.all.js"></script>
    <script src="../admin/assets/plugins/global/plugins.bundle.js"></script>
    <script src="../admin/assets/js/scripts.bundle.js"></script>
    <script src="assets/js/kas.js"></script>
    <script>
        var K = kasApp;
        var state = { bulan: '' };

        kasApp.init({
            page: 'buku-kas',
            title: 'Buku Kas',
            crumbs: [['Beranda', 'index.html'], ['Buku Kas']],
            onReady: function () {
                state.bulan = K.isoToday().slice(0, 7);
                document.getElementById('f-bulan').innerHTML = K.bulanOptions(state.bulan, true);
                document.getElementById('saldo-awal').value = K.getSaldoAwal();
                document.getElementById('saldo-awal').addEventListener('change', function () {
                    K.setSaldoAwal(Number(this.value) || 0);
                    renderBuku();
                });
                document.getElementById('f-bulan').addEventListener('change', function () {
                    state.bulan = this.value;
                    renderBuku();
                });
                document.getElementById('btn-cetak').addEventListener('click', function () {
                    window.print();
                });
                renderBuku();
            }
        });

        function renderBuku() {
            var saldoAwal = K.getSaldoAwal();
            var all = K.getTrx();
            var list = state.bulan
                ? all.filter(function (t) { return t.tanggal.indexOf(state.bulan) === 0; })
                : all.slice();

            // Saldo awal periode = saldo awal + transaksi sebelum bulan terpilih
            var sebelum = state.bulan
                ? all.filter(function (t) { return t.tanggal < state.bulan + '-01'; })
                : [];
            var saldoMulai = saldoAwal + K.sumTipe(sebelum, 'masuk') - K.sumTipe(sebelum, 'keluar');

            var asc = K.sortedTrx(list).reverse();
            var tbody = document.getElementById('tbody-buku');
            var tfoot = document.getElementById('tfoot-buku');

            var totalDebit = K.sumTipe(list, 'masuk');
            var totalKredit = K.sumTipe(list, 'keluar');

            if (!list.length) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-gray-500 fw-semibold py-8">Belum ada transaksi pada periode ini.</td></tr>';
            } else {
                var run = saldoMulai;
                tbody.innerHTML = '<tr class="fw-bold">' +
                    '<td colspan="4" class="text-start">Saldo awal periode</td>' +
                    '<td class="text-end">-</td>' +
                    '<td class="text-end">-</td>' +
                    '<td class="text-end kas-ledger-saldo">' + K.formatRupiah(saldoMulai) + '</td>' +
                    '</tr>' +
                    asc.map(function (t, i) {
                        run += t.tipe === 'masuk' ? Number(t.jumlah) : -Number(t.jumlah);
                        var isMasuk = t.tipe === 'masuk';
                        var kat = K.namaKategori(t.kategori);
                        return '<tr>' +
                            '<td class="text-center text-gray-600">' + (i + 1) + '</td>' +
                            '<td class="text-nowrap text-gray-600 fw-semibold">' + K.formatTanggalPendek(t.tanggal) + '</td>' +
                            '<td class="text-gray-800 fw-semibold">' + (t.keterangan || t.kategori) + '</td>' +
                            '<td><span class="badge badge-light" style="--bs-badge-bg:' + (kat ? kat.warna : '#a7a7c4') + '22; --bs-badge-color:' + (kat ? kat.warna : '#a7a7c4') + '">' + t.kategori + '</span></td>' +
                            '<td class="text-end ' + (isMasuk ? 'fw-bold text-success' : 'text-gray-600') + '">' + (isMasuk ? K.formatRupiah(t.jumlah) : '-') + '</td>' +
                            '<td class="text-end ' + (!isMasuk ? 'fw-bold text-danger' : 'text-gray-600') + '">' + (!isMasuk ? K.formatRupiah(t.jumlah) : '-') + '</td>' +
                            '<td class="text-end kas-ledger-saldo text-gray-800">' + K.formatRupiah(run) + '</td>' +
                            '</tr>';
                    }).join('');
            }

            var saldoAkhir = saldoMulai + totalDebit - totalKredit;
            tfoot.innerHTML = '<tr class="fw-bold bg-light">' +
                '<td colspan="4" class="text-end text-uppercase fs-7">Jumlah</td>' +
                '<td class="text-end text-success">' + K.formatRupiah(totalDebit) + '</td>' +
                '<td class="text-end text-danger">' + K.formatRupiah(totalKredit) + '</td>' +
                '<td class="text-end kas-ledger-saldo">' + K.formatRupiah(saldoAkhir) + '</td>' +
                '</tr>';

            document.getElementById('print-periode').textContent =
                'Periode: ' + (state.bulan ? K.BULAN[parseInt(state.bulan.slice(5), 10) - 1] + ' ' + state.bulan.slice(0, 4) : 'Semua periode');
            document.getElementById('print-saldo').textContent = 'Saldo Awal: ' + K.formatRupiah(saldoMulai);
        }
    </script>
</body>
</html>
